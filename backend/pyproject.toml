[project]
name = "football-ai-analyst-backend"
version = "0.1.0"
description = "Backend for the AI Football Match Analyst (FastAPI + typed tools + multi-agent analysis)"
requires-python = ">=3.11"

# Phase 0/1 dependencies only. Phase 3 adds the LLM SDK, Phase 7 the Qdrant client --
# add them in those phases, not now.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "psycopg[binary]>=3.2",
    # Migrations run as a deploy step (Phase 12b), so Alembic is a runtime dependency.
    "alembic>=1.13",
    "openai>=1.30.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "T20", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests may use long lines for readability of fixture data.
"tests/**" = ["E501"]
# CLI scripts print to stdout/stderr.
"../scripts/**" = ["T201"]
"scripts/**" = ["T201"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
strict = true
warn_unreachable = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m \"not llm\""
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "llm: calls a real LLM provider (deselected by default; run with `-m llm`)",
    "integration: needs a live PostgreSQL (these skip themselves when it is unreachable)",
]
